# Production stack for the TrueNAS Custom App (Docker Compose).
#
# Required variables (nothing has a default, so nothing is guessed). TrueNAS
# stores a literal YAML document, so scripts/render-truenas-compose substitutes
# them before it is pasted into the Custom App (and `just deploy` reuses it):
#   MEALPLAN_VERSION  image tag to run, e.g. v0.1.0
#   MEALPLAN_ROOT     app directory on the NAS dataset, laid out as:
#                       .env                  app settings (see .env.example), mode 600
#                       secrets/db_password   database password, owned 10001:10999, mode 440
#                       postgres/             database files, owned 10999:10999
#                       backups/              pg_dump output, owned 10999:10999
#   NPM_NETWORK       existing Docker network shared with Nginx Proxy Manager
#
# The app publishes no host ports: NPM reaches it over NPM_NETWORK, and the
# database is only on the internal network. TRUSTED_PROXIES in .env must cover
# NPM's address on NPM_NETWORK.

name: mealplan

services:
  app:
    image: ghcr.io/leapingfrogs/mealplan:${MEALPLAN_VERSION:?set MEALPLAN_VERSION}
    restart: unless-stopped
    env_file: ${MEALPLAN_ROOT:?set MEALPLAN_ROOT}/.env
    environment:
      DATABASE_HOST: db
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal: {}
      # NPM forwards to mealplan:4000; the alias avoids clashing with other
      # apps' generic service names on the shared network.
      proxy:
        aliases: [mealplan]
    # The image runs as uid 10001 and only writes to /tmp.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Same check as the image's HEALTHCHECK, declared here too because some
    # engines (Podman) ignore healthchecks in OCI-format images, and deploys
    # wait on it. No curl in the image: bash's /dev/tcp does the request.
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/$${PORT} &&
          printf 'GET /health/live HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  db:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    # Runs as an unprivileged uid/gid from the start, so the entrypoint needs no
    # root privileges (the image supports arbitrary ids). Not the image's own
    # 999, which on TrueNAS is the host's netdata user and docker group. The
    # data directory must be owned by 10999:10999.
    user: "10999:10999"
    environment:
      POSTGRES_USER: mealplan
      POSTGRES_DB: mealplan
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - ${MEALPLAN_ROOT:?set MEALPLAN_ROOT}/postgres:/var/lib/postgresql
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,size=1m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mealplan", "-d", "mealplan"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    logging: *logging

  # Nightly pg_dump (custom format) to MEALPLAN_ROOT/backups, with retention.
  # On demand: `bash /tmp/backup.sh manual` in this container (`just backup-now`).
  # Restore procedure: docs/backups.md.
  backup:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    user: "10999:10999"
    environment:
      PGHOST: db
      PGUSER: mealplan
      PGDATABASE: mealplan
      BACKUP_AT: "03:00" # UTC
      KEEP_DAILY: "7"
      KEEP_WEEKLY: "4"
      KEEP_MONTHLY: "6"
      KEEP_MANUAL: "10"
    secrets:
      - db_password
    volumes:
      - ${MEALPLAN_ROOT:?set MEALPLAN_ROOT}/backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Compose interpolates $, so the script's own variables are written $$.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        cat > /tmp/backup.sh <<'SCRIPT'
        set -euo pipefail
        export PGPASSWORD="$$(cat /run/secrets/db_password)"
        log() { echo "$$(date -u +%FT%TZ) backup: $$*"; }

        # Keep the newest $$2 dumps in directory $$1.
        prune() {
          { ls -1t "$$1"/*.dump 2>/dev/null || true; } | tail -n +$$(($$2 + 1)) | xargs -r rm -f --
        }

        # Dump to a .partial file, check the archive is readable, then rename,
        # so a failed or interrupted dump never looks like a good one.
        dump() {
          local kind=$$1 file
          mkdir -p "/backups/$$kind"
          file="/backups/$$kind/mealplan-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          if ! pg_dump --format=custom --file="$$file.partial"; then
            rm -f "$$file.partial"; log "FAILED: pg_dump"; return 1
          fi
          if ! pg_restore --list "$$file.partial" > /dev/null; then
            rm -f "$$file.partial"; log "FAILED: unreadable archive"; return 1
          fi
          mv "$$file.partial" "$$file"
          if [ "$$kind" = daily ]; then
            if [ "$$(date -u +%u)" = 7 ]; then mkdir -p /backups/weekly; ln -f "$$file" /backups/weekly/; fi
            if [ "$$(date -u +%d)" = 01 ]; then mkdir -p /backups/monthly; ln -f "$$file" /backups/monthly/; fi
            prune /backups/daily "$$KEEP_DAILY"
            prune /backups/weekly "$$KEEP_WEEKLY"
            prune /backups/monthly "$$KEEP_MONTHLY"
          else
            prune "/backups/$$kind" "$$KEEP_MANUAL"
          fi
          log "wrote $$file ($$(du -h --apparent-size "$$file" | cut -f1))"
        }

        # Healthy while a daily dump from the last 26 hours exists.
        health() {
          find /backups/daily -name '*.dump' -mmin -$$((26 * 60)) 2>/dev/null | grep -q .
        }

        loop() {
          trap 'exit 0' TERM INT
          if ! find /backups/daily -name '*.dump' -mmin -1440 2>/dev/null | grep -q .; then
            dump daily || true
          fi
          while true; do
            local now next
            now=$$(date -u +%s)
            next=$$(date -u -d "today $$BACKUP_AT" +%s)
            if [ "$$next" -le "$$now" ]; then next=$$(date -u -d "tomorrow $$BACKUP_AT" +%s); fi
            log "next daily backup at $$(date -u -d "@$$next" +%FT%TZ)"
            sleep $$((next - now)) & wait $$!
            dump daily || true
          done
        }

        case "$${1:-loop}" in
          loop) loop ;;
          daily | manual) dump "$$1" ;;
          health) health ;;
          *) echo "usage: backup.sh [loop|daily|manual|health]" >&2; exit 2 ;;
        esac
        SCRIPT
        exec bash /tmp/backup.sh loop
    healthcheck:
      test: ["CMD", "bash", "/tmp/backup.sh", "health"]
      # Cheap (one find); a short interval also covers engines that ignore
      # start_interval.
      interval: 1m
      timeout: 10s
      retries: 2
      start_period: 2m
      start_interval: 5s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    logging: *logging

secrets:
  db_password:
    file: ${MEALPLAN_ROOT:?set MEALPLAN_ROOT}/secrets/db_password

networks:
  # No route outside the host: only app and db talk here.
  internal:
    internal: true
  proxy:
    name: ${NPM_NETWORK:?set NPM_NETWORK}
    external: true
