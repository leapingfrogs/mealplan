name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MIX_ENV: test

jobs:
  # Formatting, lockfile hygiene, audits, compile warnings, Credo, Sobelow
  # (`mix ci.lint`, the same alias `just check` runs).
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-elixir
      - run: mix ci.lint

  # Tests with the coverage floor from coveralls.json (`mix ci.test`).
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mealplan
          POSTGRES_PASSWORD: mealplan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mealplan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-elixir
      - name: Test with coverage
        run: |
          set -o pipefail
          mix ci.test | tee coverage.txt
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Test coverage"
            echo '```'
            sed -n '/^----------------$/,$p' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  dialyzer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-elixir
      # Restore and save separately so a PLT built by a failing run is kept.
      - name: Restore PLTs
        id: plt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-
      - name: Build PLTs
        run: mix dialyzer --plt
      - name: Save PLTs
        if: steps.plt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: ${{ steps.plt-cache.outputs.cache-primary-key }}
      - run: mix dialyzer --format github

  # Informational: never blocks a merge. Dependabot opens the update PRs.
  outdated:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-elixir
      - name: Outdated dependencies
        run: |
          {
            echo "### Outdated Hex dependencies"
            echo '```'
            mix hex.outdated --all || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Lint, build (not pushed) and scan the production image.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # SARIF upload on main
    env:
      HADOLINT_VERSION: 2.15.1
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
      TRIVY_VERSION: 0.75.0
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Dockerfile versions match .tool-versions
        run: scripts/check-docker-versions

      - name: Install hadolint and Trivy (checksum verified)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  $RUNNER_TEMP/bin/hadolint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/hadolint"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "${tarball}" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: hadolint
        run: hadolint Dockerfile

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        # Normally ~2 min; fail fast if the GHA build cache hangs.
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: mealplan:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size
        run: |
          docker image inspect mealplan:ci --format '{{.Size}}' |
            awk '{printf "### Image\nUncompressed size: %.1f MB\n", $1/1e6}' >> "$GITHUB_STEP_SUMMARY"

      - name: Compose smoke test (stack boots healthy, proxy behaviour)
        env:
          MEALPLAN_TEST_IMAGE: mealplan:ci
        run: scripts/compose-smoke-test

      - name: Trivy (fail on fixable HIGH/CRITICAL)
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 mealplan:ci

      - name: Trivy SARIF report
        if: always() && github.event_name == 'push'
        # Same filter as the gate: only alerts that have a fix available.
        run: trivy image --format sarif --output trivy.sarif --ignore-unfixed mealplan:ci

      - name: Upload SARIF to code scanning
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy-image

  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (checksum verified)
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "${tarball}" actionlint
      - run: ./actionlint -color
      # Deploy and test scripts run as root on the NAS; shellcheck ships with
      # the runner image.
      - name: shellcheck scripts
        run: shellcheck --severity=warning scripts/*
