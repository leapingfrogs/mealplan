# Commit prefixes follow Conventional Commits so Dependabot PRs pass commitlint
# and land in release-please's changelog as build/ci changes.
version: 2

updates:
  - package-ecosystem: mix
    directory: /
    schedule:
      interval: weekly
    # Skip releases younger than two weeks (supply-chain safety margin).
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    groups:
      mix-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Skip releases younger than two weeks (supply-chain safety margin).
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-tooling:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Skip releases younger than two weeks (supply-chain safety margin).
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-images:
        patterns: ["*"]

  # Postgres image used by the db and backup services in compose.yaml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    # Skip releases younger than two weeks (supply-chain safety margin).
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    # Skip releases younger than two weeks (supply-chain safety margin).
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
